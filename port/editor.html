<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merlin Map Editor</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #1a1a1a; color: #ddd;
        font: 13px/1.4 system-ui, sans-serif; }
      #editor { display: flex; flex-direction: column; height: 100%; }
      #toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        padding: 8px 12px; background: #232323; border-bottom: 1px solid #000; }
      #toolbar .group { display: flex; gap: 4px; align-items: center; }
      #toolbar label { color: #999; font-size: 12px; }
      #toolbar button, #toolbar select {
        background: #333; color: #ddd; border: 1px solid #444; border-radius: 4px;
        padding: 4px 9px; font: inherit; cursor: pointer; }
      #toolbar button.on { background: #cc0; color: #111; border-color: #cc0; font-weight: 600; }
      #toolbar button:hover { border-color: #777; }
      #toolbar .sep { width: 1px; height: 22px; background: #444; }
      #status { margin-left: auto; color: #9a9; }
      #status.dirty { color: #fc6; }
      #main { display: flex; flex: 1; min-height: 0; }
      #mapWrap { flex: 1; overflow: auto; display: flex; align-items: flex-start;
        justify-content: center; padding: 16px; }
      #mapCanvas { image-rendering: pixelated; background: #000; box-shadow: 0 0 0 1px #000; cursor: crosshair; }
      #paletteWrap { width: 260px; overflow: auto; border-left: 1px solid #000; background: #181818; padding: 8px; }
      #paletteWrap h3 { margin: 10px 0 6px; font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: .05em; }
      #paletteWrap h3:first-child { margin-top: 2px; }
      #roomHint { color: #666; font-weight: 400; text-transform: none; letter-spacing: 0; }
      #minimapCanvas { image-rendering: pixelated; background: #0d0d0d; width: 100%; height: auto; cursor: pointer; border: 1px solid #000; }
      #paletteCanvas { image-rendering: pixelated; background: #111; width: 100%; height: auto; cursor: pointer; }
      #hint { padding: 4px 12px; background: #1f1f1f; color: #777; font-size: 11px; border-top: 1px solid #000; }
    </style>
  </head>
  <body>
    <div id="editor">
      <div id="toolbar">
        <div class="group"><label>Map</label><select id="mapSel"></select></div>
        <button id="newBtn" title="New blank map">＋ New</button>
        <button id="resizeBtn" title="Resize the room grid / room tile size">⤢ Resize</button>
        <div class="group"><label>Room</label><select id="roomSel"></select></div>
        <div class="sep"></div>
        <div class="group" id="layerGroup"><label>Layer</label></div>
        <div class="group"><label>Tileset</label><select id="tilesetSel" title="changeKeySet: swap this layer's tileset (remaps tiles by symbol)"></select></div>
        <div class="sep"></div>
        <div class="group" id="toolGroup"><label>Tool</label></div>
        <div class="sep"></div>
        <div class="group" id="roomActions"><label>Room</label></div>
        <div class="sep"></div>
        <div class="group"><label>Zoom</label><button id="zoomOut" title="Zoom out (Ctrl+wheel)">−</button><span id="zoomVal">2×</span><button id="zoomIn" title="Zoom in (Ctrl+wheel)">+</button></div>
        <div class="sep"></div>
        <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button id="saveBtn" title="Save (Ctrl+S)">💾 Save</button>
        <span id="status">loading…</span>
      </div>
      <div id="main">
        <div id="mapWrap"><canvas id="mapCanvas"></canvas></div>
        <div id="paletteWrap">
        <h3>Rooms <span id="roomHint"></span></h3><canvas id="minimapCanvas" title="click a room to jump · click an empty cell to add a room"></canvas>
        <h3 id="palTitle">Tiles</h3><canvas id="paletteCanvas"></canvas>
      </div>
      </div>
      <div id="hint">Brush: pick a tile or drag a range in the palette, then stamp · P brush · C grab region · G fill · R rect · E pick · X erase · Ctrl+wheel zoom · Ctrl+Z undo · Ctrl+S save</div>
    </div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
